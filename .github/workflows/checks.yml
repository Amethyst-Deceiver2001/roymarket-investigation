# Runs the repo's own checks on every push and pull request.
# data/sources/ and data/roymarket.db are gitignored and absent here, so
# check_registry.py runs with --no-local-files; run it without the flag locally.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: |
          fail=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python3 "$t" || { echo "::error file=$t::failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
      - name: Registry check
        run: python3 scripts/check_registry.py --quiet --no-local-files
      - name: Tag balance of published pages
        run: python3 scripts/check_tag_balance.py docs/index.html
